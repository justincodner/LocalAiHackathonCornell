<!doctype html>
<!-- Owner: Mac owner. Simple fully labelled form for the safari_form fixture and A-story rehearsals. No network resources. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volunteer sign-up</title>
<style>
  body { margin: 0; background: #f6f7f9; color: #1d232b;
         font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 40px auto; background: #fff; border: 1px solid #d8dde3; border-radius: 10px; padding: 26px 30px; }
  h1 { margin-top: 0; font-size: 24px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=email], select, textarea { width: 100%; box-sizing: border-box; padding: 9px 11px; font: inherit;
         border: 1px solid #b9c1cb; border-radius: 6px; }
  textarea { min-height: 90px; }
  fieldset { border: 1px solid #d8dde3; border-radius: 6px; margin: 0 0 16px; }
  .inline label { display: inline; font-weight: 400; margin-right: 14px; }
  button { font: inherit; font-weight: 600; padding: 10px 22px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; cursor: pointer; }
  #thanks { display: none; color: #1a7f37; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Volunteer sign-up</h1>
  <form id="f" onsubmit="document.getElementById('thanks').style.display='block'; return false;">
    <div class="field"><label for="first">First name</label><input type="text" id="first" name="first" autocomplete="off"></div>
    <div class="field"><label for="last">Last name</label><input type="text" id="last" name="last" autocomplete="off"></div>
    <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="off"></div>
    <div class="field"><label for="role">Preferred role</label>
      <select id="role" name="role"><option>Greeter</option><option>Setup crew</option><option>Note taker</option></select>
    </div>
    <fieldset class="inline">
      <legend>Availability</legend>
      <input type="radio" id="sat" name="day" value="sat"><label for="sat">Saturday</label>
      <input type="radio" id="sun" name="day" value="sun"><label for="sun">Sunday</label>
    </fieldset>
    <div class="field"><label for="notes">Anything we should know?</label><textarea id="notes" name="notes"></textarea></div>
    <div class="field inline"><input type="checkbox" id="updates" name="updates"><label for="updates">Send me event updates</label></div>
    <button type="submit">Submit</button>
    <p id="thanks" role="status">Thanks, you're signed up.</p>
  </form>
</main>
</body>
</html>
