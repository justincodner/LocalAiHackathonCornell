[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beacon-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
    "websockets>=15,<17",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["beacon_brain"]

[tool.pytest.ini_options]
markers = ["loop: Brain event-to-speech integration tests"]
