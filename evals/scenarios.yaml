- id: mail_summary
  category: read
  fixture: mail_inbox
  utterance: "What's on my screen?"
  expect:
    tool: say
    text_contains_any: [Sarah, inbox]

- id: mail_read_sarah
  category: read
  fixture: mail_inbox
  utterance: "Read the message from Sarah."
  expect:
    tool: read_element
    target_label_contains_any: [Sarah Chen, "still on for lunch", "lunch tomorrow"]

- id: mail_read_selected
  category: read
  fixture: mail_inbox
  utterance: "Read my selected lunch message aloud."
  expect:
    tool: read_element
